<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Lista de compradores cadastrados no AgroConnect.">
  <title>Compradores | AgroConnect</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <script src="js/script.js" defer></script>
</head>
<body data-page="compradores">
  <aside id="sidebar" class="sidebar" aria-label="Menu principal">
    <a class="brand" href="dashboard.html" aria-label="Ir para o dashboard">
      <span class="brand-icon" aria-hidden="true">A</span>
      <span class="brand-name">AgroConnect</span>
    </a>

    <p class="menu-label">MENU PRINCIPAL</p>
    <nav aria-label="Navegação principal">
      <a class="nav-link" href="dashboard.html">
        <i class="nav-icon bx bxs-dashboard" aria-hidden="true"></i>
        <span>Dashboard</span>
      </a>
      <a class="nav-link" href="pedidos.html">
        <i class="nav-icon bx bx-clipboard" aria-hidden="true"></i>
        <span>Pedidos</span>
      </a>
      <a class="nav-link active" href="comprador.html" aria-current="page">
        <i class="nav-icon bx bx-group" aria-hidden="true"></i>
        <span>Compradores</span>
      </a>
      <a class="nav-link" href="colheita.html">
        <i class="nav-icon bx bx-leaf" aria-hidden="true"></i>
        <span>Colheitas</span>
      </a>
      <a class="nav-link" href="usuarios.html">
        <i class="nav-icon bx bx-user" aria-hidden="true"></i>
        <span>Usuários</span>
      </a>
      <a class="nav-link" href="empresa.html">
        <i class="nav-icon bx bx-buildings" aria-hidden="true"></i>
        <span>Empresas</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <span class="status-dot" aria-hidden="true"></span>
      <span>Sistema conectado</span>
    </div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <button
        id="menu-button"
        class="menu-button"
        type="button"
        aria-controls="sidebar"
        aria-expanded="true"
      >
        <span class="hamburger-icon" aria-hidden="true">☰</span>
        <span>Menu</span>
      </button>
      <span class="topbar-caption">Gerenciamento de compradores</span>
      <a class="logout-button" href="index.html">Sair</a>
    </header>

    <div class="page-content">
      <section class="users-section page-section" aria-labelledby="buyers-title">
        <div class="users-heading">
          <div>
            <p class="eyebrow">CADASTROS</p>
            <h1 id="buyers-title">Lista de Compradores</h1>
          </div>
          <div class="list-heading-actions">
            <label for="filtroStatus">Exibir</label>
            <select id="filtroStatus" aria-label="Filtrar compradores por status">
              <option value="ativos" selected>Ativos</option>
              <option value="inativos">Inativos</option>
              <option value="todos">Todos</option>
            </select>
            <button id="add-buyer-button" class="add-user-button" type="button">Adicionar Comprador</button>
          </div>
        </div>

        <p id="buyers-message" class="users-message" role="status" aria-live="polite">Carregando compradores...</p>

        <div class="users-table-wrapper">
          <table class="users-table">
            <thead>
              <tr>
                <th scope="col">ID</th>
                <th scope="col">Nome</th>
                <th scope="col">CNPJ/CPF</th>
                <th scope="col">Endereço de Entrega</th>
                <th scope="col">Status</th>
                <th scope="col">Ações</th>
              </tr>
            </thead>
            <tbody id="buyers-table-body"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <div id="buyer-modal" class="user-modal" hidden>
    <section
      class="user-modal-content"
      role="dialog"
      aria-modal="true"
      aria-labelledby="buyer-modal-title"
    >
      <h2 id="buyer-modal-title">Cadastrar Comprador</h2>
      <form id="buyer-form">
        <label class="user-form-field" for="buyer-name">
          Nome
          <input id="buyer-name" name="nome" type="text" autocomplete="name" required>
        </label>
        <label class="user-form-field" for="buyer-document">
          CNPJ/CPF
          <input id="buyer-document" name="cnpjOuCpf" type="text" inputmode="numeric" maxlength="14" required>
        </label>
        <div class="buyer-address-grid" aria-label="Endereço de Entrega">
          <label class="user-form-field buyer-address-cep" for="buyer-cep">
            CEP
            <input id="buyer-cep" name="cep" type="text" inputmode="numeric" autocomplete="postal-code" maxlength="9" required>
          </label>
          <label class="user-form-field buyer-address-street" for="buyer-street">
            Logradouro (Rua)
            <input id="buyer-street" name="logradouro" type="text" autocomplete="address-line1" required>
          </label>
          <label class="user-form-field buyer-address-number" for="buyer-number">
            Número
            <input id="buyer-number" name="numero" type="text" required>
          </label>
          <label class="user-form-field buyer-address-complement" for="buyer-complement">
            Complemento
            <input id="buyer-complement" name="complemento" type="text" autocomplete="address-line2">
          </label>
          <label class="user-form-field buyer-address-neighborhood" for="buyer-neighborhood">
            Bairro
            <input id="buyer-neighborhood" name="bairro" type="text" autocomplete="address-level3" required>
          </label>
          <label class="user-form-field buyer-address-city" for="buyer-city">
            Cidade
            <input id="buyer-city" name="cidade" type="text" autocomplete="address-level2" required>
          </label>
          <label class="user-form-field buyer-address-state" for="buyer-state">
            UF
            <input id="buyer-state" name="uf" type="text" autocomplete="address-level1" maxlength="2" required>
          </label>
        </div>
        <p id="buyer-cep-message" class="user-form-message" role="status" aria-live="polite"></p>
        <p id="buyer-form-message" class="user-form-message" role="alert" aria-live="polite"></p>
        <div class="user-modal-actions">
          <button id="buyer-cancel-button" class="user-cancel-button" type="button">Cancelar</button>
          <button id="buyer-save-button" class="user-save-button" type="submit">Salvar</button>
        </div>
      </form>
    </section>
  </div>
</body>
</html>
