<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Lista de colheitas cadastradas no AgroConnect.">
  <title>Colheitas | AgroConnect</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <script src="js/script.js" defer></script>
</head>
<body data-page="colheitas">
  <aside id="sidebar" class="sidebar" aria-label="Menu principal">
    <a class="brand" href="dashboard.html" aria-label="Ir para o dashboard">
      <span class="brand-icon" aria-hidden="true">A</span>
      <span class="brand-name">AgroConnect</span>
    </a>

    <p class="menu-label">MENU PRINCIPAL</p>
    <nav aria-label="Navegação principal">
      <a class="nav-link" href="dashboard.html">
        <i class="nav-icon bx bxs-dashboard" aria-hidden="true"></i>
        <span>Dashboard</span>
      </a>
      <a class="nav-link" href="pedidos.html">
        <i class="nav-icon bx bx-clipboard" aria-hidden="true"></i>
        <span>Pedidos</span>
      </a>
      <a class="nav-link" href="comprador.html">
        <i class="nav-icon bx bx-group" aria-hidden="true"></i>
        <span>Compradores</span>
      </a>
      <a class="nav-link active" href="colheita.html" aria-current="page">
        <i class="nav-icon bx bx-leaf" aria-hidden="true"></i>
        <span>Colheitas</span>
      </a>
      <a class="nav-link" href="usuarios.html">
        <i class="nav-icon bx bx-user" aria-hidden="true"></i>
        <span>Usuários</span>
      </a>
      <a class="nav-link" href="empresa.html">
        <i class="nav-icon bx bx-buildings" aria-hidden="true"></i>
        <span>Empresas</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <span class="status-dot" aria-hidden="true"></span>
      <span>Sistema conectado</span>
    </div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <button
        id="menu-button"
        class="menu-button"
        type="button"
        aria-controls="sidebar"
        aria-expanded="true"
      >
        <span class="hamburger-icon" aria-hidden="true">☰</span>
        <span>Menu</span>
      </button>
      <span class="topbar-caption">Gerenciamento de colheitas</span>
      <a class="logout-button" href="index.html">Sair</a>
    </header>

    <div class="page-content">
      <section class="users-section page-section" aria-labelledby="harvests-title">
        <div class="users-heading">
          <div>
            <p class="eyebrow">CADASTROS</p>
            <h1 id="harvests-title">Lista de Colheitas</h1>
          </div>
          <div class="list-heading-actions">
            <label for="filtroStatus">Exibir</label>
            <select id="filtroStatus" aria-label="Filtrar colheitas por status">
              <option value="ativos" selected>Ativos</option>
              <option value="inativos">Inativos</option>
              <option value="todos">Todos</option>
            </select>
            <button id="add-harvest-button" class="add-user-button" type="button">Adicionar Colheita</button>
          </div>
        </div>

        <p id="harvests-message" class="users-message" role="status" aria-live="polite">Carregando colheitas...</p>

        <div class="users-table-wrapper">
          <table class="users-table">
            <thead>
              <tr>
                <th scope="col">ID</th>
                <th scope="col">Produto</th>
                <th scope="col">CPF do Produtor</th>
                <th scope="col">Quantidade em Estoque</th>
                <th scope="col">Valor</th>
                <th scope="col">Status</th>
                <th scope="col">Ações</th>
              </tr>
            </thead>
            <tbody id="harvests-table-body"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <div id="harvest-modal" class="user-modal" hidden>
    <section
      class="user-modal-content"
      role="dialog"
      aria-modal="true"
      aria-labelledby="harvest-modal-title"
    >
      <h2 id="harvest-modal-title">Cadastrar Colheita</h2>
      <form id="harvest-form">
        <label class="user-form-field" for="harvest-product">
          Produto
          <input id="harvest-product" name="nomeProduto" type="text" required>
        </label>
        <label class="user-form-field" for="cpfProdutor">
          Produtor
          <select id="cpfProdutor" name="cpfProdutor" required>
            <option value="" disabled selected>Selecione uma opção...</option>
          </select>
        </label>
        <label class="user-form-field" for="harvest-quantity">
          Quantidade em Estoque
          <input id="harvest-quantity" name="quantidadeEstoque" type="number" min="0" step="1" required>
        </label>
        <label class="user-form-field" for="harvest-value">
          Valor
          <input id="harvest-value" name="valorProduto" type="number" min="0" step="0.01" required>
        </label>
        <p id="harvest-form-message" class="user-form-message" role="alert" aria-live="polite"></p>
        <div class="user-modal-actions">
          <button id="harvest-cancel-button" class="user-cancel-button" type="button">Cancelar</button>
          <button id="harvest-save-button" class="user-save-button" type="submit">Salvar</button>
        </div>
      </form>
    </section>
  </div>
</body>
</html>
