<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Lista de usuários cadastrados no AgroConnect.">
  <title>Usuários | AgroConnect</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <script src="js/script.js" defer></script>
</head>
<body data-page="usuarios">
  <aside id="sidebar" class="sidebar" aria-label="Menu principal">
    <a class="brand" href="dashboard.html" aria-label="Ir para o dashboard">
      <span class="brand-icon" aria-hidden="true">A</span>
      <span class="brand-name">AgroConnect</span>
    </a>

    <p class="menu-label">MENU PRINCIPAL</p>
    <nav aria-label="Navegação principal">
      <a class="nav-link" href="dashboard.html">
        <i class="nav-icon bx bxs-dashboard" aria-hidden="true"></i>
        <span>Dashboard</span>
      </a>
      <a class="nav-link" href="pedidos.html">
        <i class="nav-icon bx bx-clipboard" aria-hidden="true"></i>
        <span>Pedidos</span>
      </a>
      <a class="nav-link" href="comprador.html">
        <i class="nav-icon bx bx-group" aria-hidden="true"></i>
        <span>Compradores</span>
      </a>
      <a class="nav-link" href="colheita.html">
        <i class="nav-icon bx bx-leaf" aria-hidden="true"></i>
        <span>Colheitas</span>
      </a>
      <a class="nav-link active" href="usuarios.html" aria-current="page">
        <i class="nav-icon bx bx-user" aria-hidden="true"></i>
        <span>Usuários</span>
      </a>
      <a class="nav-link" href="empresa.html">
        <i class="nav-icon bx bx-buildings" aria-hidden="true"></i>
        <span>Empresas</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <span class="status-dot" aria-hidden="true"></span>
      <span>Sistema conectado</span>
    </div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <button
        id="menu-button"
        class="menu-button"
        type="button"
        aria-controls="sidebar"
        aria-expanded="true"
      >
        <span class="hamburger-icon" aria-hidden="true">☰</span>
        <span>Menu</span>
      </button>
      <span class="topbar-caption">Gerenciamento de usuários</span>
      <a class="logout-button" href="index.html">Sair</a>
    </header>

    <div class="page-content">
      <section class="users-section page-section" aria-labelledby="users-title">
        <div class="users-heading">
          <div>
            <p class="eyebrow">CADASTROS</p>
            <h1 id="users-title">Lista de Usuários</h1>
          </div>
          <div class="list-heading-actions">
            <label for="filtroStatus">Exibir</label>
            <select id="filtroStatus" aria-label="Filtrar usuários por status">
              <option value="ativos" selected>Ativos</option>
              <option value="inativos">Inativos</option>
              <option value="todos">Todos</option>
            </select>
            <button id="add-user-button" class="add-user-button" type="button">Adicionar Usuário</button>
          </div>
        </div>

        <p id="users-message" class="users-message" role="status" aria-live="polite">Carregando usuários...</p>

        <div class="users-table-wrapper">
          <table class="users-table">
            <thead>
              <tr>
                <th scope="col">Nome</th>
                <th scope="col">CPF</th>
                <th scope="col">Data de Nascimento</th>
                <th scope="col">Empresa</th>
                <th scope="col">Status</th>
                <th scope="col">Ações</th>
              </tr>
            </thead>
            <tbody id="users-table-body"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <div id="user-modal" class="user-modal" hidden>
    <section
      class="user-modal-content"
      role="dialog"
      aria-modal="true"
      aria-labelledby="user-modal-title"
    >
      <h2 id="user-modal-title">Cadastrar Usuário</h2>
      <form id="user-form">
        <label class="user-form-field" for="user-name">
          Nome
          <input id="user-name" name="nome" type="text" autocomplete="name" required>
        </label>
        <label class="user-form-field" for="user-cpf">
          CPF
          <input id="user-cpf" name="cpf" type="text" inputmode="numeric" maxlength="11" required>
        </label>
        <label class="user-form-field" for="user-birth-date">
          Data de Nascimento
          <input id="user-birth-date" name="dataNascimento" type="date" required>
        </label>
        <label class="user-form-field" for="empresa_id">
          Empresa
          <select id="empresa_id" name="empresa_id" required>
            <option value="" disabled selected>Selecione uma opção...</option>
          </select>
        </label>
        <label class="user-form-field" for="user-password">
          Senha
          <input id="user-password" name="senha" type="password" autocomplete="new-password" required>
        </label>
        <p id="user-form-message" class="user-form-message" role="alert" aria-live="polite"></p>
        <div class="user-modal-actions">
          <button id="user-cancel-button" class="user-cancel-button" type="button">Cancelar</button>
          <button id="user-save-button" class="user-save-button" type="submit">Salvar</button>
        </div>
      </form>
    </section>
  </div>
</body>
</html>
