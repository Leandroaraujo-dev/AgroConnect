<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Acesse o AgroConnect para gerenciar sua produção e seus pedidos.">
  <title>Entrar no AgroConnect</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <script src="js/script.js" defer></script>
</head>
<body data-page="login">
  <main class="login-container">
    <section class="login-card" aria-labelledby="login-title">
      <div class="login-brand-icon" aria-hidden="true">AgroConnect</div>
      <p class="login-eyebrow">Bem-vindo de volta</p>
      <h1 id="login-title">Entrar na sua conta</h1>
      <p class="login-description">Informe seus dados para acessar o sistema.</p>

      <form id="login-form">
        <div class="login-field">
          <label for="login">Login</label>
          <input
            id="login"
            name="login"
            type="text"
            autocomplete="username"
            placeholder="Digite seu login"
            required
          >
        </div>

        <div class="login-field">
          <label for="senha">Senha</label>
          <input
            id="senha"
            name="senha"
            type="password"
            autocomplete="current-password"
            placeholder="Digite sua senha"
            required
          >
        </div>

        <button id="login-button" class="login-submit" type="submit">Entrar</button>
      </form>

      <p id="login-message" class="login-message" role="status" aria-live="polite"></p>
    </section>
  </main>
</body>
</html>
